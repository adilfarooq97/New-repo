# LinkedIn Content Calendar
# Weekly seed topics for an Angular frontend developer sharing practical lessons.
# NOTE: templates here are only a last-resort scaffold. The main flow generates
# humanized story-style posts via the LLM (see agent/llm_generator.py). These
# body_templates are deliberately plain — no emojis, no bullet scaffolding.

weekly_schedule:
  # Monday: Angular architecture
  0:
    primary_topic: "Angular Application Architecture"
    subtopics:
      - "Standalone components and feature boundaries"
      - "Smart and presentational component boundaries"
      - "Route-level lazy loading"
      - "Keeping shared services focused"
    post_type: "lesson"
    series_length: 4

  # Tuesday: Angular performance
  1:
    primary_topic: "Angular Performance Optimization"
    subtopics:
      - "Change detection and rendering cost"
      - "OnPush in real applications"
      - "Lazy loading and bundle size"
      - "Avoiding unnecessary subscriptions"
    post_type: "lesson"
    series_length: 4

  # Wednesday: RxJS and state
  2:
    primary_topic: "RxJS and Reactive Frontend Patterns"
    subtopics:
      - "Cancellation with switchMap"
      - "Loading and error state design"
      - "Avoiding nested subscriptions"
      - "Choosing signals or observables"
    post_type: "lesson"
    series_length: 4

  # Thursday: TypeScript
  3:
    primary_topic: "TypeScript for Scalable Frontend Systems"
    subtopics:
      - "Strict types at API boundaries"
      - "Reusable domain types"
      - "Avoiding any in UI code"
      - "Discriminated unions for UI state"
    post_type: "lesson"
    series_length: 4

  # Friday: Angular testing
  4:
    primary_topic: "Angular Testing and Maintainability"
    subtopics:
      - "Testing components without brittle selectors"
      - "Testing services at the right boundary"
      - "Mocking HTTP requests clearly"
      - "Keeping tests useful during refactors"
    post_type: "lesson"
    series_length: 4

  # Saturday: Frontend developer lessons
  5:
    primary_topic: "Things I Learned Building Angular Products"
    subtopics:
      - "A UI bug that taught me something"
      - "A frontend tool that changed my workflow"
      - "A mistake I kept repeating in Angular"
      - "Something I wish I knew earlier"
    post_type: "story"
    series_length: 4

  # Sunday: Reliable user interfaces
  6:
    primary_topic: "Building Reliable User Interfaces"
    subtopics:
      - "Designing useful empty states"
      - "Handling slow network responses"
      - "Accessible form validation"
      - "Making errors recoverable"
    post_type: "lesson"
    series_length: 4

# Plain fallback scaffolds only (the LLM path is preferred and humanized).
post_templates:
  lesson:
    title_template: "{subtopic}"
    body_template: |
      Something about {subtopic} that took me a while to figure out.

      {hashtags}

  story:
    title_template: "{subtopic}"
    body_template: |
      A short story about {subtopic} from my own work.

      {hashtags}
